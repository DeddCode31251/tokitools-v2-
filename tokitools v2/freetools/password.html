<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Generator PRO</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">

  <div class="bg-white shadow-lg p-6 rounded-lg w-full max-w-md text-center">
    <h1 class="text-2xl font-bold text-blue-600 mb-4">🔐 Password Generator</h1>

    <input id="passwordOutput" type="text" readonly class="w-full p-3 mb-4 text-center bg-gray-100 border rounded font-mono" />

    <button onclick="generatePassword()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded mb-2">Generate Password</button>

    <!-- Pro Options -->
    <div id="proTools" class=" mt-4">
      <h2 class="text-lg font-semibold text-green-600 mb-2">PRO Options</h2>

      <label class="block mb-2 text-left text-sm font-semibold">Length:
        <input id="lengthInput" type="number" value="16" min="6" max="50" class="w-full p-2 border rounded mt-1">
      </label>

      <label class="block text-left mb-2 text-sm"><input type="checkbox" id="includeSymbols" checked class="mr-2">Include Symbols</label>
      <label class="block text-left mb-2 text-sm"><input type="checkbox" id="includeNumbers" checked class="mr-2">Include Numbers</label>
      <label class="block text-left mb-4 text-sm"><input type="checkbox" id="includeLetters" checked class="mr-2">Include Letters</label>

      <button onclick="savePassword()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded mb-2">💾 Save Password</button>
      <button onclick="exportPassword()" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">📤 Export</button>
    </div>

  </div>

  <script>
    function generatePassword() {
      let length = 12;
      let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";

      const isPro = !document.getElementById("proTools").classList.contains("hidden");
      if (isPro) {
        length = parseInt(document.getElementById("lengthInput").value);
        chars = "";
        if (document.getElementById("includeLetters").checked) chars += "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
        if (document.getElementById("includeNumbers").checked) chars += "0123456789";
        if (document.getElementById("includeSymbols").checked) chars += "!@#$%^&*()_+[]{}<>?/|~";
      }

      if (!chars) return alert("Please select at least one character set!");

      let password = "";
      for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }

      document.getElementById("passwordOutput").value = password;
    }


    function savePassword() {
      const pass = document.getElementById("passwordOutput").value;
      if (!pass) return alert("Generate a password first.");
      localStorage.setItem("lastPassword", pass);
      alert("✅ Password saved locally!");
    }

    function exportPassword() {
      const pass = document.getElementById("passwordOutput").value;
      if (!pass) return alert("Generate a password first.");
      const blob = new Blob([pass], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "password.txt";
      link.click();
    }
  </script>
</body>
</html>
