<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Background Remover</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');

        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        body {
            background-image: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            background-color: rgba(255, 255, 255, 0.7);
            width: 100%;
            max-width: 800px;
            margin: 20px 0;
        }

        .container > h1 {
            text-shadow: 1px 1px rgb(200, 200, 200);
            text-align: center;
            margin-bottom: 15px;
        }

        .container > p {
            font-size: 17px;
            text-align: center;
        }

        .container > .removing {
            font-size: 17px;
            letter-spacing: 2px;
            text-align: center;
        }

        .custum-file-upload {
            height: 150px;
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: space-between;
            gap: 20px;
            margin: 20px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            border: 2px dashed #cacaca;
            background-color: rgba(255, 255, 255, 1);
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0px 48px 35px -48px rgba(0,0,0,0.1);
        }

        .custum-file-upload .icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custum-file-upload .icon svg {
            height: 80px;
            fill: rgba(75, 85, 99, 1);
        }

        .custum-file-upload .text {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custum-file-upload .text span {
            font-weight: 400;
            color: rgba(75, 85, 99, 1);
        }

        .custum-file-upload input {
            display: none;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .buttons button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            outline: none;
            background-color: #ed5e37;
            border-radius: 5px;
            cursor: pointer;
            color: #ffff;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            flex: 1;
            min-width: 150px;
        }

        .buttons button:hover {
            background-color: #aa5b45;
        }

        #resultImage {
            margin: 20px 0;
            max-width: 100%;
            height: auto;
        }


        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .buttons button {
                width: 100%;
            }
            
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .container > h1 {
                font-size: 24px;
            }
        }


        /* Main content (empty space for ads only) */
        .content {
            flex: 1;
        }

        /* Title of page*/
            #tokitoolsTitle {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      position: relative;
      color: transparent;
      background: linear-gradient(135deg, #ff6a00, #ff0066, #00c6ff);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientSlide 5s infinite linear;

      /* Glassy glowing edge */
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.7),
                   0 0 40px rgba(0, 198, 255, 0.6),
                   0 0 60px rgba(255, 106, 0, 0.5);
        margin-bottom: 2vw;
    }

    /* Gradient animation */
    @keyframes gradientSlide {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 200% center;
      }
    }

    /* Elegant underline */
    #tokitoolsTitle::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 80%;
      height: 4px;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff6a00, #ff0066, #00c6ff);
      animation: underlineGlow 3s infinite alternate;
    }

    @keyframes underlineGlow {
      0% {
        box-shadow: 0 0 10px #ff0066;
      }
      100% {
        box-shadow: 0 0 25px #00c6ff;
      }
    }
    </style>
</head>
<body>
    <div class="main">
      <h1 id="tokitoolsTitle">Background Remover Tool</h1>
        <div class="container">
            <h1>Image Background Remover</h1>
            <p class="p">Upload your image here.</p>
            <label class="custum-file-upload" for="file">
                <div class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="" viewBox="0 0 24 24"><g stroke-width="0" id="SVGRepo_bgCarrier"></g><g stroke-linejoin="round" stroke-linecap="round" id="SVGRepo_tracerCarrier"></g><g id="SVGRepo_iconCarrier"> <path fill="" d="M10 1C9.73478 1 9.48043 1.10536 9.29289 1.29289L3.29289 7.29289C3.10536 7.48043 3 7.73478 3 8V20C3 21.6569 4.34315 23 6 23H7C7.55228 23 8 22.5523 8 22C8 21.4477 7.55228 21 7 21H6C5.44772 21 5 20.5523 5 20V9H10C10.5523 9 11 8.55228 11 8V3H18C18.5523 3 19 3.44772 19 4V9C19 9.55228 19.4477 10 20 10C20.5523 10 21 9.55228 21 9V4C21 2.34315 19.6569 1 18 1H10ZM9 7H6.41421L9 4.41421V7ZM14 15.5C14 14.1193 15.1193 13 16.5 13C17.8807 13 19 14.1193 19 15.5V16V17H20C21.1046 17 22 17.8954 22 19C22 20.1046 21.1046 21 20 21H13C11.8954 21 11 20.1046 11 19C11 17.8954 11.8954 17 13 17H14V16V15.5ZM16.5 11C14.142 11 12.2076 12.8136 12.0156 15.122C10.2825 15.5606 9 17.1305 9 19C9 21.2091 10.7909 23 13 23H20C22.2091 23 24 21.2091 24 19C24 17.1305 22.7175 15.5606 20.9844 15.122C20.7924 12.8136 18.858 11 16.5 11Z" clip-rule="evenodd" fill-rule="evenodd"></path> </g></svg>
                </div>
                <div class="text">
                    <span>Click to upload image</span>
                </div>
                <input type="file" id="file">
            </label>

            <p class="removing" style="display: none;">Removing Background...</p>

            <div class="result" style="display: none;">
                <img id="resultImage" src="" alt="" width="400px">
                
                <div class="buttons">
                    <button onclick="location.reload()">Upload Again</button>
                    <button onclick="downloadFile()">Download Image</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let imageURL;
        
        document.getElementById('file').addEventListener('change', async function() {
            const fileInput = document.getElementById('file');
            const image = fileInput.files[0];

            document.querySelector('.custum-file-upload').style.display = 'none';
            document.querySelector('.p').style.display = 'none';
            document.querySelector('.removing').style.display = '';

            // Multipart file
            const formData = new FormData();
            formData.append('image_file', image);
            formData.append('size', 'auto');

            const apiKey = "c4Ce5rPdwPYc6RmcjwSVyZzA";

            fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: {
                    'X-Api-Key': apiKey
                },
                body: formData
            })
            .then(function(response) {
                return response.blob();
            })
            .then(function(blob) {
                const url = URL.createObjectURL(blob);
                imageURL = url;
                const resultImage = document.getElementById('resultImage');
                resultImage.src = url;
                document.querySelector('.removing').style.display = 'none';
                document.querySelector('.result').style.display = '';
            })
            .catch(function(error) {
                console.error('Error:', error);
                alert('Failed to remove background. Please try again.');
                location.reload();
            });
        });

        function downloadFile() {
            if (!imageURL) {
                alert("No image to download!");
                return;
            }
            var a = document.createElement('a');
            a.href = imageURL;
            a.download = 'background_removed_image.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
