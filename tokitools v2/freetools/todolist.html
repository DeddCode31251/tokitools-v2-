<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadcode Project 1 Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c1e3e, #152a57);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e6f0ff;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(16, 24, 47, 0.85);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(64, 128, 255, 0.2);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background: linear-gradient(90deg, #0d2b5c, #1a3f8f);
            padding: 25px 30px;
            position: relative;
            overflow: hidden;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            font-weight: 700;
            background: linear-gradient(to right, #4dabff, #a0d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 64, 255, 0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(13, 43, 92, 0.6);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(64, 128, 255, 0.3);
            min-width: 140px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(to right, #4dabff, #a0d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card .label {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            padding: 20px;
            background: rgba(10, 20, 40, 0.6);
            border-bottom: 1px solid rgba(64, 128, 255, 0.1);
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 16px 20px;
            background: rgba(10, 20, 40, 0.7);
            border: 2px solid rgba(64, 128, 255, 0.2);
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            color: #e6f0ff;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(180, 200, 255, 0.5);
        }

        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }

        .btn-primary {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 0 28px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px 20px;
            background: rgba(10, 20, 40, 0.6);
            border-bottom: 1px solid rgba(64, 128, 255, 0.1);
        }

        .filter-btn {
            background: rgba(13, 43, 92, 0.6);
            color: #a0d0ff;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(64, 128, 255, 0.2);
        }

        .filter-btn:hover {
            background: rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        .view-options {
            display: flex;
            gap: 12px;
            margin-left: auto;
        }

        .view-btn {
            background: rgba(13, 43, 92, 0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0d0ff;
            border: 1px solid rgba(64, 128, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-btn:hover, .view-btn.active {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            transform: translateY(-2px);
        }

        .todo-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .todo-item {
            padding: 18px 20px;
            margin: 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            background: rgba(13, 26, 52, 0.7);
            border: 1px solid rgba(64, 128, 255, 0.15);
            animation: slideIn 0.4s ease-out;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .todo-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 5px;
            background: #3b82f6;
            transition: width 0.3s ease;
        }

        .todo-item:hover::before {
            width: 8px;
        }

        .todo-item.priority-high::before {
            background: linear-gradient(to bottom, #ff416c, #ff4b2b);
        }

        .todo-item.priority-medium::before {
            background: linear-gradient(to bottom, #ffb347, #ffcc33);
        }

        .todo-item.priority-low::before {
            background: linear-gradient(to bottom, #0cebeb, #20e3b2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .todo-item.removing {
            animation: slideOut 0.4s ease-out forwards;
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(20px); }
        }

        .todo-item.completed {
            background: rgba(13, 43, 92, 0.4);
        }

        .todo-item.completed .todo-text {
            color: rgba(180, 200, 255, 0.5);
        }

        .todo-checkbox {
            margin-right: 18px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #3b82f6;
            position: relative;
            z-index: 2;
        }

        .todo-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .todo-text {
            font-size: 1.2rem;
            color: #e6f0ff;
            transition: all 0.3s ease;
            position: relative;
            padding-right: 20px;
        }

        .todo-item.completed .todo-text::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #3b82f6;
            transform: translateY(-50%);
            animation: strike 0.3s ease-out forwards;
        }

        @keyframes strike {
            from { width: 0; }
            to { width: 100%; }
        }

        .todo-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: rgba(180, 200, 255, 0.7);
        }

        .todo-category {
            background: rgba(59, 130, 246, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .todo-due {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
        }

        .todo-actions button {
            background: rgba(13, 43, 92, 0.6);
            border: 1px solid rgba(64, 128, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #a0d0ff;
        }

        .todo-actions button:hover {
            background: rgba(37, 99, 235, 0.3);
            transform: translateY(-2px);
            color: white;
        }

        .edit-btn:hover {
            background: rgba(76, 175, 80, 0.3) !important;
        }

        .delete-btn:hover {
            background: rgba(244, 67, 54, 0.3) !important;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(180, 200, 255, 0.5);
        }

        .empty-state i {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 1.5rem;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .advanced-options {
            padding: 20px;
            background: rgba(10, 20, 40, 0.6);
            border-top: 1px solid rgba(64, 128, 255, 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-group label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .option-group select, .option-group input {
            padding: 12px 15px;
            background: rgba(10, 20, 40, 0.7);
            border: 2px solid rgba(64, 128, 255, 0.2);
            border-radius: 12px;
            color: #e6f0ff;
            font-size: 1rem;
            outline: none;
        }

        .option-group select:focus, .option-group input:focus {
            border-color: #3b82f6;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
            border-top: 1px solid rgba(64, 128, 255, 0.1);
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            .stats {
                flex-wrap: wrap;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .view-options {
                margin-left: 0;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>DeadCode Project1 Manager</h1>
                <p>Your productivity command center</p>
                
                <div class="stats">
                    <div class="stat-card">
                        <div class="value" id="total-tasks">0</div>
                        <div class="label">Total Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="value" id="completed-tasks">0</div>
                        <div class="label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="value" id="pending-tasks">0</div>
                        <div class="label">Pending</div>
                    </div>
                </div>
            </div>
        </header>
        
        <div class="controls">
            <div class="input-group">
                <input type="text" id="new-todo" placeholder="Add a new task...">
                <button class="btn-primary" id="add-btn"><i class="fas fa-plus"></i> Add Task</button>
            </div>
            <div class="input-group">
                <input type="text" id="search" placeholder="Search tasks...">
            </div>
        </div>
        
        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                <i class="fas fa-list"></i> All Tasks
            </button>
            <button class="filter-btn" data-filter="active">
                <i class="fas fa-circle-notch"></i> Active
            </button>
            <button class="filter-btn" data-filter="completed">
                <i class="fas fa-check-circle"></i> Completed
            </button>
            <button class="filter-btn" data-filter="priority-high">
                <i class="fas fa-exclamation-circle"></i> High Priority
            </button>
            
            <div class="view-options">
                <button class="view-btn active" data-view="list">
                    <i class="fas fa-list"></i>
                </button>
                <button class="view-btn" data-view="grid">
                    <i class="fas fa-th-large"></i>
                </button>
                <button class="view-btn" data-view="compact">
                    <i class="fas fa-compress"></i>
                </button>
            </div>
        </div>
        
        <ul class="todo-list" id="todo-list">
            <li class="empty-state" id="empty-state">
                <i class="fas fa-stars"></i>
                <h3>No Tasks Found</h3>
                <p>Add your first task to get started</p>
            </li>
        </ul>
        
        <div class="advanced-options">
            <div class="option-group">
                <label for="priority"><i class="fas fa-flag"></i> Default Priority</label>
                <select id="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            
            <div class="option-group">
                <label for="category"><i class="fas fa-tag"></i> Default Category</label>
                <select id="category">
                    <option value="personal">Personal</option>
                    <option value="work" selected>Work</option>
                    <option value="shopping">Shopping</option>
                    <option value="health">Health</option>
                </select>
            </div>
            
            <div class="option-group">
                <label for="due-date"><i class="fas fa-calendar"></i> Default Due Date</label>
                <input type="date" id="due-date">
            </div>
        </div>
        
        <div class="footer">
            <p>Deadcode Project1 Task Manager v2.0 • All tasks saved locally</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM elements
            const newTodoInput = document.getElementById('new-todo');
            const addBtn = document.getElementById('add-btn');
            const todoList = document.getElementById('todo-list');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const viewBtns = document.querySelectorAll('.view-btn');
            const searchInput = document.getElementById('search');
            const emptyState = document.getElementById('empty-state');
            const totalTasksEl = document.getElementById('total-tasks');
            const completedTasksEl = document.getElementById('completed-tasks');
            const pendingTasksEl = document.getElementById('pending-tasks');
            const prioritySelect = document.getElementById('priority');
            const categorySelect = document.getElementById('category');
            const dueDateInput = document.getElementById('due-date');
            
            // Initialize due date to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            dueDateInput.valueAsDate = tomorrow;
            
            let todos = JSON.parse(localStorage.getItem('todos')) || [];
            let currentFilter = 'all';
            let currentView = 'list';
            
            // Initialize the app
            renderTodos();
            updateStats();
            
            // Add new todo
            addBtn.addEventListener('click', addTodo);
            newTodoInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTodo();
            });
            
            // Filter todos
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTodos();
                });
            });
            
            // View options
            viewBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    viewBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentView = btn.dataset.view;
                    applyViewMode();
                });
            });
            
            // Search functionality
            searchInput.addEventListener('input', () => {
                renderTodos();
            });
            
            function addTodo() {
                const text = newTodoInput.value.trim();
                if (text) {
                    const newTodo = {
                        id: Date.now(),
                        text,
                        completed: false,
                        priority: prioritySelect.value,
                        category: categorySelect.value,
                        dueDate: dueDateInput.value,
                        createdAt: new Date().toISOString()
                    };
                    
                    todos.push(newTodo);
                    saveTodos();
                    renderTodos();
                    updateStats();
                    newTodoInput.value = '';
                    newTodoInput.focus();
                    
                    // Hide empty state
                    if (emptyState) emptyState.style.display = 'none';
                    
                    // Show animation
                    animateAddButton();
                }
            }
            
            function animateAddButton() {
                addBtn.innerHTML = '<i class="fas fa-check"></i> Added!';
                addBtn.style.background = 'linear-gradient(90deg, #10b981, #059669)';
                
                setTimeout(() => {
                    addBtn.innerHTML = '<i class="fas fa-plus"></i> Add Task';
                    addBtn.style.background = 'linear-gradient(90deg, #3b82f6, #2563eb)';
                }, 1500);
            }
            
            function renderTodos() {
                // Filter todos based on current filter and search
                const searchTerm = searchInput.value.toLowerCase();
                let filteredTodos = todos.filter(todo => {
                    const matchesSearch = todo.text.toLowerCase().includes(searchTerm);
                    
                    if (currentFilter === 'all') return matchesSearch;
                    if (currentFilter === 'active') return !todo.completed && matchesSearch;
                    if (currentFilter === 'completed') return todo.completed && matchesSearch;
                    if (currentFilter === 'priority-high') return todo.priority === 'high' && matchesSearch;
                    return true;
                });
                
                // Sort by priority (high first)
                filteredTodos.sort((a, b) => {
                    const priorityOrder = { high: 3, medium: 2, low: 1 };
                    return priorityOrder[b.priority] - priorityOrder[a.priority];
                });
                
                todoList.innerHTML = '';
                
                if (filteredTodos.length === 0) {
                    if (emptyState) {
                        emptyState.style.display = 'block';
                        emptyState.innerHTML = `
                            <i class="fas fa-stars"></i>
                            <h3>No Tasks Found</h3>
                            <p>Try changing your filters or add a new task</p>
                        `;
                    }
                    return;
                }
                
                if (emptyState) emptyState.style.display = 'none';
                
                filteredTodos.forEach(todo => {
                    const todoItem = createTodoElement(todo);
                    todoList.appendChild(todoItem);
                });
                
                applyViewMode();
            }
            
            function applyViewMode() {
                const todoItems = document.querySelectorAll('.todo-item');
                
                todoItems.forEach(item => {
                    item.classList.remove('list-view', 'grid-view', 'compact-view');
                    item.classList.add(`${currentView}-view`);
                });
            }
            
            function createTodoElement(todo) {
                const li = document.createElement('li');
                li.className = `todo-item priority-${todo.priority}`;
                li.dataset.id = todo.id;
                
                if (todo.completed) {
                    li.classList.add('completed');
                }
                
                // Format due date
                const dueDate = todo.dueDate ? new Date(todo.dueDate) : null;
                const dueDateStr = dueDate ? dueDate.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric',
                    year: dueDate.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
                }) : 'No due date';
                
                li.innerHTML = `
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}>
                    <div class="todo-content">
                        <div class="todo-text">${todo.text}</div>
                        <div class="todo-meta">
                            <div class="todo-category">${todo.category}</div>
                            <div class="todo-due">
                                <i class="far fa-calendar"></i> ${dueDateStr}
                            </div>
                            <div class="todo-priority">
                                <i class="fas fa-flag"></i> ${todo.priority.charAt(0).toUpperCase() + todo.priority.slice(1)}
                            </div>
                        </div>
                    </div>
                    <div class="todo-actions">
                        <button class="edit-btn"><i class="fas fa-edit"></i></button>
                        <button class="delete-btn"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                
                // Add event listeners
                const checkbox = li.querySelector('.todo-checkbox');
                const editBtn = li.querySelector('.edit-btn');
                const deleteBtn = li.querySelector('.delete-btn');
                
                checkbox.addEventListener('change', () => toggleComplete(todo.id));
                deleteBtn.addEventListener('click', () => deleteTodo(todo.id, li));
                editBtn.addEventListener('click', () => editTodo(todo, li));
                
                return li;
            }
            
            function toggleComplete(id) {
                todos = todos.map(todo => 
                    todo.id === id ? {...todo, completed: !todo.completed} : todo
                );
                saveTodos();
                renderTodos();
                updateStats();
            }
            
            function deleteTodo(id, element) {
                element.classList.add('removing');
                
                setTimeout(() => {
                    todos = todos.filter(todo => todo.id !== id);
                    saveTodos();
                    renderTodos();
                    updateStats();
                }, 400);
            }
            
            function editTodo(todo, element) {
                // Create edit form
                const editForm = document.createElement('div');
                editForm.className = 'edit-form';
                
                const dueDate = todo.dueDate ? new Date(todo.dueDate).toISOString().split('T')[0] : '';
                
                editForm.innerHTML = `
                    <div style="display: grid; gap: 12px; width: 100%;">
                        <input type="text" class="edit-input" value="${todo.text}" placeholder="Task text">
                        <div style="display: flex; gap: 12px;">
                            <select id="edit-priority" style="flex: 1;">
                                <option value="low" ${todo.priority === 'low' ? 'selected' : ''}>Low Priority</option>
                                <option value="medium" ${todo.priority === 'medium' ? 'selected' : ''}>Medium Priority</option>
                                <option value="high" ${todo.priority === 'high' ? 'selected' : ''}>High Priority</option>
                            </select>
                            <select id="edit-category" style="flex: 1;">
                                <option value="personal" ${todo.category === 'personal' ? 'selected' : ''}>Personal</option>
                                <option value="work" ${todo.category === 'work' ? 'selected' : ''}>Work</option>
                                <option value="shopping" ${todo.category === 'shopping' ? 'selected' : ''}>Shopping</option>
                                <option value="health" ${todo.category === 'health' ? 'selected' : ''}>Health</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <input type="date" id="edit-due-date" value="${dueDate}" style="flex: 1;">
                            <div style="display: flex; gap: 8px;">
                                <button class="save-btn" style="background: #10b981; padding: 0 20px; border-radius: 12px; border: none; color: white; cursor: pointer;">Save</button>
                                <button class="cancel-btn" style="background: #ef4444; padding: 0 20px; border-radius: 12px; border: none; color: white; cursor: pointer;">Cancel</button>
                            </div>
                        </div>
                    </div>
                `;
                
                element.innerHTML = '';
                element.appendChild(editForm);
                
                const textInput = editForm.querySelector('.edit-input');
                const saveBtn = editForm.querySelector('.save-btn');
                const cancelBtn = editForm.querySelector('.cancel-btn');
                
                textInput.focus();
                textInput.select();
                
                saveBtn.addEventListener('click', () => {
                    const newText = textInput.value.trim();
                    if (newText) {
                        const priority = editForm.querySelector('#edit-priority').value;
                        const category = editForm.querySelector('#edit-category').value;
                        const dueDate = editForm.querySelector('#edit-due-date').value;
                        
                        todos = todos.map(t => 
                            t.id === todo.id ? {...t, text: newText, priority, category, dueDate} : t
                        );
                        saveTodos();
                        renderTodos();
                    }
                });
                
                cancelBtn.addEventListener('click', () => {
                    renderTodos();
                });
            }
            
            function updateStats() {
                const total = todos.length;
                const completed = todos.filter(todo => todo.completed).length;
                const pending = total - completed;
                
                totalTasksEl.textContent = total;
                completedTasksEl.textContent = completed;
                pendingTasksEl.textContent = pending;
            }
            
            function saveTodos() {
                localStorage.setItem('todos', JSON.stringify(todos));
            }
        });
    </script>

</body>
</html>
