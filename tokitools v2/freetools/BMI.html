<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI Calculator PRO</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .background-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .particles {
      position: absolute;
      display: block;
      list-style: none;
      width: 100%;
      height: 100%;
    }

    .particles li {
      position: absolute;
      display: block;
      background: rgba(67, 97, 238, 0.2);
      bottom: -100px;
      animation: particle-animation 20s linear infinite;
      border-radius: 50%;
    }

    @keyframes particle-animation {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
      }
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Ad */
    .header-ad {
      background: #f8f9fa;
      padding: 10px 0;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
      width: 100%;
    }

    /* Footer Ad */
    .footer-ad {
      background: #f8f9fa;
      padding: 10px 0;
      text-align: center;
      border-top: 1px solid #e0e0e0;
      width: 100%;
      margin-top: auto;
    }
    
    /* Sidebar Ad */
    .sidebar-ad {
      background: #fff;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      width: 160px;
      text-align: center;
      position: sticky;
      top: 20px;
      margin-left: 20px;
      height: fit-content;
    }
    
    /* Main Content Layout */
    .main-content {
      display: flex;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
      width: 100%;
      flex: 1;
    }
    
    .calculator-wrapper {
      flex: 1;
      max-width: 500px;
      margin: 0 auto;
    }
    
    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .sidebar-ad {
        display: none;
      }
      
      .main-content {
        padding: 0 10px;
      }
    }

    .ad-container {
      margin: 15px 0;
      text-align: center;
    }
    /* title of the page */
        #tokitoolsTitle {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      position: relative;
      color: transparent;
      background: linear-gradient(135deg, #ff6a00, #ff0066, #00c6ff);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientSlide 5s infinite linear;

      /* Glassy glowing edge */
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.7),
                   0 0 40px rgba(0, 198, 255, 0.6),
                   0 0 60px rgba(255, 106, 0, 0.5);
    }

    /* Gradient animation */
    @keyframes gradientSlide {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 200% center;
      }
    }

    /* Elegant underline */
    #tokitoolsTitle::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 80%;
      height: 4px;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff6a00, #ff0066, #00c6ff);
      animation: underlineGlow 3s infinite alternate;
    }

    @keyframes underlineGlow {
      0% {
        box-shadow: 0 0 10px #ff0066;
      }
      100% {
        box-shadow: 0 0 25px #00c6ff;
      }
    }
  </style>
</head>
<body>
      <h1 id="tokitoolsTitle">BMI Calculator tool</h1>
  <div class="main-content">
    <div class="calculator-wrapper">
      <div class="background-animation">
        <ul class="particles">
          <li style="left: 5%; width: 20px; height: 20px; animation-delay: 0s"></li>
          <li style="left: 20%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 16s;"></li>
          <li style="left: 40%; width: 25px; height: 25px; animation-delay: 5s"></li>
          <li style="left: 60%; width: 15px; height: 15px; animation-delay: 0s; animation-duration: 18s;"></li>
          <li style="left: 80%; width: 28px; height: 28px; animation-delay: 3s"></li>
        </ul>
      </div>

      <!-- Calculator Content -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-green-600 mb-4 text-center">BMI Calculator</h1>

        <!-- Unit Toggle -->
        <div id="proToggle" class="mb-4">
          <select id="unitSelect" class="w-full p-2 border border-gray-300 rounded">
            <option value="metric">Metric (kg/cm)</option>
            <option value="imperial">Imperial (lbs/in)</option>
          </select>
        </div>

        <!-- Inputs -->
        <input id="weight" type="number" placeholder="Weight" class="w-full p-2 border border-gray-300 rounded mb-3">
        <input id="height" type="number" placeholder="Height" class="w-full p-2 border border-gray-300 rounded mb-4">

        <button onclick="calcBMI()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded w-full">Calculate BMI</button>
        <p id="result" class="mt-4 font-semibold text-gray-800 text-center"></p>


        <!-- PRO Buttons -->
        <div id="proButtons" class="mt-6">
          <button onclick="saveBMI()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded mb-3 w-full">Save BMI</button>
          <button onclick="exportBMI()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded w-full">Export History</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    function calcBMI() {
      const unit = document.getElementById("unitSelect").value;
      const w = parseFloat(document.getElementById("weight").value);
      const h = parseFloat(document.getElementById("height").value);
      if (!w || !h) return alert("Please enter both values.");

      let bmi = 0;
      if (unit === "metric") {
        bmi = w / ((h / 100) ** 2);
      } else {
        bmi = (703 * w) / (h ** 2);
      }

      const rounded = bmi.toFixed(2);
      let status = "";
      if (bmi < 18.5) status = "Underweight";
      else if (bmi < 25) status = "Normal";
      else if (bmi < 30) status = "Overweight";
      else status = "Obese";

      document.getElementById("result").textContent = `BMI: ${rounded} (${status})`;
    }
    
    function saveBMI() {
      const bmiText = document.getElementById("result").textContent;
      if (!bmiText) return alert("Calculate your BMI first.");
      const old = localStorage.getItem("bmiHistory") || "";
      localStorage.setItem("bmiHistory", old + "\n" + bmiText);
      alert("BMI Saved");
    }

    function exportBMI() {
      const data = localStorage.getItem("bmiHistory") || "No history yet.";
      const blob = new Blob([data], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "bmi-history.txt";
      link.click();
    }

  </script>
</body>
</html>
